name: cms-admin-node-typescript-ssr

services:
  app:
    container_name: cms-admin-node-typescript-ssr
    build: .
    ports:
      - "5008:5008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "5008"
      API_BASE_URL: "${API_BASE_URL:-http://host.docker.internal:3008}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
